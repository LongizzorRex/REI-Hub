& Bath', s:24, len:12, done:false},\n          {t:'Flooring', s:34, len:6, done:false},\n          {t:'Punch List & Staging', s:40, len:7, done:false},\n        ],\n        costs:[\n          {item:'Roofing materials', cat:'Material', qty:1, unit:8200, vendor:'ABC Supply'},\n          {item:'Kitchen cabinets', cat:'Material', qty:1, unit:7400, vendor:'ProSource'},\n          {item:'LVP flooring', cat:'Material', qty:1480, unit:3.2, vendor:'Floor & Decor'},\n          {item:'General labor', cat:'Labor', qty:1, unit:14500, vendor:'Reyes Const.'},\n          {item:'Permits', cat:'Soft', qty:1, unit:1850, vendor:'City of Columbus'},\n        ],\n        contractors:[\n          {name:'Reyes Construction', trade:'General', phone:'614-555-0211', rate:'Bid', status:'Active'},\n          {name:'Apex Roofing', trade:'Roofing', phone:'614-555-0233', rate:'Bid', status:'Done'},\n          {name:'BrightSpark Electric', trade:'Electrical', phone:'614-555-0244', rate:'$95/hr', status:'Scheduled'},\n        ]\n      },\n      {id:'r2', name:'Cedar St — Light Rehab', start:'2026-07-15',\n        tasks:[\n          {t:'Paint Interior', s:0, len:7, done:false},\n          {t:'Refinish Floors', s:6, len:4, done:false},\n          {t:'Landscaping', s:9, len:3, done:false},\n          {t:'Final Clean', s:12, len:2, done:false},\n        ],\n        costs:[\n          {item:'Interior paint', cat:'Material', qty:25, unit:34, vendor:'Sherwin-Williams'},\n          {item:'Floor refinish labor', cat:'Labor', qty:1, unit:3200, vendor:'TX Floors'},\n        ],\n        contractors:[ {name:'Lone Star Painters', trade:'Paint', phone:'512-555-0260', rate:'$2.1/sqft', status:'Active'} ]\n      }\n    ],\n    fsbo:[\n      {t:'Pull comps (3 sold, 0.5mi, 90 days)', d:true},\n      {t:'Verify owner of record via county GIS', d:true},\n      {t:'Confirm no liens / back taxes', d:false},\n      {t:'Drive the neighborhood + rent survey', d:true},\n      {t:'Estimate rehab w/ contractor walk', d:false},\n      {t:'Run Worth-Buying analyzer', d:true},\n      {t:'Submit written offer + proof of funds', d:false},\n      {t:'Schedule inspection within option period', d:false},\n      {t:'Order title & survey', d:false},\n      {t:'Lock financing / line up cash', d:false},\n      {t:'Final walkthrough', d:false},\n      {t:'Close & record deed', d:false},\n    ],\n    listing:{ addr:'1842 Maple Ave, Columbus OH', price:215000, beds:3, baths:2, sqft:1480, year:1968,\n      desc:'Charming brick ranch on a quiet street. Updated mechanicals, large fenced lot, 2-car garage. Walk to parks & schools. Motivated seller — bring offers.',\n      features:'New roof (2025)|Fenced yard|2-car garage|Hardwood floors|Updated HVAC' }\n  };\n}\n\nlet DB;\nfunction load(){\n  try{ DB = JSON.parse(localStorage.getItem(LS_KEY)) || seed(); }\n  catch(e){ DB = seed(); }\n  if(!DB.settings) DB = seed();\n}\nfunction save(){\n  try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); flashSaved(); }\n  catch(e){ toast('Can\\u2019t save \\u2014 private mode or storage full. Changes stay until reload.'); }\n}\nfunction wipeData(){\n  if(confirm('Reset all demo data?')){\n    try{ localStorage.removeItem(LS_KEY); }catch(e){}\n    load(); renderAll(); toast('Demo data reset.');\n  }\n}\n\n\nfunction monthlyPI(loan, ratePct, years=30){\n  if(loan<=0) return 0;\n  const r = ratePct/100/12, n=years*12;\n  if(r===0) return loan/n;\n  return loan * r / (1 - Math.pow(1+r,-n));\n}\nfunction propMetrics(p){\n  const pi = monthlyPI(p.loan, p.rate);\n  const opex = (p.taxes+p.ins)/12 + p.rent*(p.mgmt+p.maint+p.vac);\n  const noi = (p.rent - p.rent*(p.mgmt+p.maint+p.vac)) *12 - (p.taxes+p.ins);\n  const cf = p.rent - opex - pi;\n  const equity = p.value - p.loan;\n  const cap = noi / p.value;\n  const cashIn = Math.max(p.basis - p.loan, 1);\n  const coc = (cf*12)/cashIn;\n  return {pi, cf, equity, cap, coc, noi};\n}\n\n\nconst clamp=(x,a,b)=>Math.max(a,Math.min(b,x));\nconst lin=(x,lo,hi)=>clamp((x-lo)/(hi-lo),0,1);\n\nfunction worthScore(d){\n  const strat = d.strategy || 'rental';\n  const rentEff = (d.rentAfter && d.rentAfter>0) ? d.rentAfter : d.rent;\n  const allIn = d.price + d.rehab;\n  const closing = d.price*0.03;\n  const loan = d.price*(1-d.downPct);\n  const pi = monthlyPI(loan, d.rate);\n  const vacPct = d.mgmt+d.maint+d.vac;\n  const opex = (d.taxes+d.ins)/12 + rentEff*vacPct;\n  const cf = rentEff - opex - pi;\n  const noi = (rentEff*(1-vacPct))*12 - (d.taxes+d.ins);\n  const cap = noi/d.price;\n  const cashIn = d.price*d.downPct + d.rehab + closing;\n  const coc = (cf*12)/Math.max(cashIn,1);\n  const onePct = rentEff/d.price;\n  const equityCap = (d.arv-allIn)/d.arv;\n  const rule70 = d.arv*0.70 - d.rehab;\n  const rule70Margin = (rule70 - d.price)/d.arv;\n\n  /* --- flip economics --- */\n  const sellCost = d.arv*0.07;\n  const holding  = pi*6 + (d.taxes+d.ins)/2;\n  const flipProfit = d.arv - sellCost - allIn - holding;\n  const flipCashIn = cashIn + holding;\n  const flipROI  = flipProfit/Math.max(flipCashIn,1);\n  const flipMargin = flipProfit/d.arv;\n\n  /* --- BRRRR economics (refi at 75% ARV) --- */\n  const refiLoan = d.arv*0.75;\n  const refiPI = monthlyPI(refiLoan, d.rate);\n  const brrrrCf = rentEff - opex - refiPI;\n  const cashLeftIn = Math.max(cashIn - (refiLoan - loan), 0);\n  const recoveredPct = clamp(1 - cashLeftIn/Math.max(cashIn,1), 0, 1);\n\n  /* --- fix & rent (value-add hold, no refi) economics --- */\n  const yoc = noi/Math.max(allIn,1);\n  const rentUplift = rentEff - d.rent;\n  const renoROI = (rentUplift*12)/Math.max(d.rehab,1);\n  const profit12 = cf*12 + (d.arv - allIn) + d.arv*(d.appreciation/100);\n\n  const sCap   = lin(cap, 0.04, 0.10)*100;\n  const sCoc   = lin(coc, 0.0, 0.12)*100;\n  const sCf    = lin(cf, -150, 450)*100;\n  const sOne   = lin(onePct, 0.006, 0.011)*100;\n  const sEq    = lin(equityCap, 0.0, 0.28)*100;\n  const sDom   = lin(d.dom, 7, 90)*100;\n  const sDrop  = lin(d.dropPct, 0, 0.12)*100;\n  const sMkt   = clamp(60 + (d.appreciation-3)*9 - (d.rate-5)*7, 0, 100);\n  const sFlipROI = lin(flipROI, 0.0, 0.35)*100;\n  const sFlipMrg = lin(flipMargin, 0.05, 0.25)*100;\n  const sRule70  = lin(rule70Margin, -0.10, 0.05)*100;\n  const sCashLeft= lin(recoveredPct, 0.40, 1.0)*100;\n  const sBrrrrCf = lin(brrrrCf, -150, 450)*100;\n  const sYoc     = lin(yoc, 0.04, 0.10)*100;\n  const sRenoROI = lin(renoROI, 0.0, 0.18)*100;\n\n  let W, score;\n  if(strat==='flip'){\n    W={flipROI:0.30, flipMrg:0.22, rule70:0.18, eq:0.12, dom:0.08, drop:0.04, mkt:0.06};\n    score = sFlipROI*W.flipROI + sFlipMrg*W.flipMrg + sRule70*W.rule70 + sEq*W.eq\n          + sDom*W.dom + sDrop*W.drop + sMkt*W.mkt;\n  } else if(strat==='brrrr'){\n    W={cashLeft:0.26, brrrrCf:0.20, cap:0.16, eq:0.14, rule70:0.10, dom:0.06, drop:0.02, mkt:0.06};\n    score = sCashLeft*W.cashLeft + sBrrrrCf*W.brrrrCf + sCap*W.cap + sEq*W.eq\n          + sRule70*W.rule70 + sDom*W.dom + sDrop*W.drop + sMkt*W.mkt;\n  } else if(strat==='fixrent'){\n    W={coc:0.16, cf:0.16, yoc:0.18, eq:0.18, renoROI:0.12, dom:0.06, drop:0.06, mkt:0.08};\n    score = sCoc*W.coc + sCf*W.cf + sYoc*W.yoc + sEq*W.eq\n          + sRenoROI*W.renoROI + sDom*W.dom + sDrop*W.drop + sMkt*W.mkt;\n  } else {\n    W={cap:0.20, coc:0.20, cf:0.16, one:0.14, eq:0.10, dom:0.08, drop:0.04, mkt:0.08};\n    score = sCap*W.cap + sCoc*W.coc + sCf*W.cf + sOne*W.one\n          + sEq*W.eq + sDom*W.dom + sDrop*W.drop + sMkt*W.mkt;\n  }\n\n  let verdict='PASS', cls='badge-pass';\n  if(score>=75){verdict='STRONG BUY';cls='badge-strong';}\n  else if(score>=60){verdict='BUY';cls='badge-buy';}\n  else if(score>=45){verdict='NEGOTIATE';cls='badge-hold';}\n\n  return {score:Math.round(score), verdict, cls, strat, rentEff, cap, coc, cf, onePct, equityCap,\n          rule70, rule70Margin, noi, pi, allIn, cashIn, sellCost, holding,\n          flipProfit, flipROI, flipMargin, refiLoan, refiPI, brrrrCf, cashLeftIn, recoveredPct,\n          yoc, rentUplift, renoROI, profit12,\n          subs:{sCap,sCoc,sCf,sOne,sEq,sDom,sDrop,sMkt,sFlipROI,sFlipMrg,sRule70,sCashLeft,sBrrrrCf,sYoc,sRenoROI}};\n}\n\n\nconst TABS=['dashboard','deals','analyzer','portfolio','pipeline','reno','market','listings'];\nlet mapInited=false;\nfunction go(tab){\n  if(LIVE_LOCKED && tab==='portfolio'){ paywall('The Portfolio tracker'); return; }\n  if(LIVE_LOCKED && tab==='analyzer'){ paywall('The Deal Analyzer'); return; }\n  TABS.forEach(t=>{\n    document.getElementById('tab-'+t).classList.toggle('active', t===tab);\n    document.querySelector('.navword[data-tab=\"'+t+'\"]').classList.toggle('active', t===tab);\n  });\n  if(tab==='dashboard'){ setTimeout(()=>{ if(map) map.invalidateSize(); }, 60); renderDash(); }\n  if(tab==='portfolio') renderPortfolio();\n  if(tab==='market') renderMarket();\n  if(tab==='reno') renderReno();\n  window.scrollTo({top:0,behavior:'smooth'});\n}\n\n\nlet toastTimer;\nfunction toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.style.display='none',2200); }\nfunction flashSaved(){ const d=document.getElementById('netDot'); d.style.background='var(--gold)'; setTimeout(()=>d.style.background='var(--accent)',400); }\nfunction openModal(title, html){ document.getElementById('modalTitle').textContent=title; document.getElementById('modalBody').innerHTML=html; document.getElementById('modal').classList.add('open'); }\nfunction closeModal(){ document.getElementById('modal').classList.remove('open'); }\n\n\nconst LIVE_LOCKED = document.body.getAttribute('data-build')==='free';\nconst SUBSCRIBE_URL = 'https://planex.lemonsqueezy.com/checkout/buy/841a30e8-82ed-4d5f-8c66-8f2269507145';\nfunction paywall(feature){\n  openModal('\\uD83D\\uDD12 Subscribe for Live Data', `<div class=\"text-[13px] leading-relaxed text-ink\">\n    <p><b>${feature||'This feature'}<\u002Fb> runs on <b>live market data<\u002Fb> \\u2014 real mortgage rates, listings, days-on-market, parcel &amp; tax records, and market trends that refresh automatically.<\u002Fp>\n    <p class=\"mt-2\" style=\"color:var(--inksoft)\">You're on the free offline version, which uses numbers you enter yourself. Upgrade to <b>Live Data<\u002Fb> to unlock this.<\u002Fp>\n    <div class=\"soft rounded-lg p-3 mt-3 text-[12px] leading-relaxed\">\\u2713 Live mortgage rates<br>\\u2713 Real listings &amp; price-drop alerts<br>\\u2713 Parcel, APN &amp; tax records<br>\\u2713 Up-to-date 50-state market trends<\u002Fdiv>\n    <a href=\"${SUBSCRIBE_URL}\" target=\"_blank\" rel=\"noopener\" class=\"pill pill-green w-full mt-4\" style=\"justify-content:center\">Subscribe for Live Data \\u2192<\u002Fa>\n    <button onclick=\"closeModal()\" class=\"pill pill-ghost w-full mt-2\" style=\"justify-content:center\">Maybe later<\u002Fbutton>\n  <\u002Fdiv>`);\n}\nfunction gateLive(feature){ if(LIVE_LOCKED){ paywall(feature); return true; } return false; }\n\n\n\nconst WORKER_BASE = 'https://rei-hub-data.YOURNAME.workers.dev';\nfunction liveState(){\n  return { key: localStorage.getItem('reihub_license')||'', instance: localStorage.getItem('reihub_instance')||'', active: localStorage.getItem('reihub_live')==='1' };\n}\nfunction setLiveChip(){\n  const s=liveState(), dot=document.getElementById('liveDot'), txt=document.getElementById('liveBtnTxt');\n  if(!dot) return;\n  dot.style.background = s.active ? 'var(--accent)' : 'var(--inksoft)';\n  txt.textContent = s.active ? 'Live Data on' : 'Live Data';\n}\nfunction openLiveData(){\n  const s=liveState();\n  if(s.active){\n    openModal('◆ Live Data active', `<div class=\"text-[13px] leading-relaxed text-ink\">\n      <div class=\"soft rounded-lg p-3\">Your subscription is <b style=\"color:var(--accent)\">active<\u002Fb> on this device. Rates, listings, parcel/tax records, and market trends refresh automatically.<\u002Fdiv>\n      <p class=\"mt-3\" style=\"color:var(--inksoft)\">License: <code style=\"font-size:11px\">${s.key.slice(0,4)}…${s.key.slice(-4)}<\u002Fcode><\u002Fp>\n      <button onclick=\"deactivateLicense()\" class=\"pill pill-outline w-full mt-4\" style=\"justify-content:center\">Deactivate on this device<\u002Fbutton>\n      <button onclick=\"closeModal()\" class=\"pill pill-ghost w-full mt-2\" style=\"justify-content:center\">Close<\u002Fbutton>\n    <\u002Fdiv>`);\n    return;\n  }\n  openModal('◆ Activate Live Data', `<div class=\"text-[13px] leading-relaxed text-ink\">\n    <p>Paste the <b>license key<\u002Fb> from your subscription email to turn on live data.<\u002Fp>\n    <input id=\"licInput\" type=\"text\" placeholder=\"XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX\" value=\"${s.key}\" class=\"w-full px-3 py-2.5 text-[13px] mt-3\" style=\"font-family:monospace\" autocomplete=\"off\" spellcheck=\"false\">\n    <div id=\"licMsg\" class=\"text-[12px] mt-2\" style=\"min-height:16px;color:var(--inksoft)\"><\u002Fdiv>\n    <button id=\"licBtn\" onclick=\"activateLicense()\" class=\"pill pill-green w-full mt-2\" style=\"justify-content:center\">Activate<\u002Fbutton>\n    <div class=\"soft rounded-lg p-3 mt-3 text-[12px]\" style=\"color:var(--inksoft)\">No key yet? <a href=\"${SUBSCRIBE_URL}\" target=\"_blank\" rel=\"noopener\" class=\"text-accent\" style=\"font-weight:600\">Subscribe for Live Data →<\u002Fa><\u002Fdiv>\n  <\u002Fdiv>`);\n  setTimeout(()=>{ const i=document.getElementById('licInput'); if(i) i.focus(); }, 60);\n}\nasync function activateLicense(){\n  const inp=document.getElementById('licInput'), msg=document.getElementById('licMsg'), btn=document.getElementById('licBtn');\n  const key=(inp.value||'').trim();\n  if(!key){ msg.textContent='Please paste your license key.'; msg.style.color='var(--red)'; return; }\n  btn.disabled=true; btn.textContent='Activating…'; msg.style.color='var(--inksoft)'; msg.textContent='Checking your subscription…';\n  try{\n    const label = encodeURIComponent(navigator.platform||'device');\n    const res = await fetch(`${WORKER_BASE}/?action=activate&key=${encodeURIComponent(key)}&label=${label}`);\n    const out = await res.json();\n    if(res.ok && out.activated){\n      localStorage.setItem('reihub_license', key);\n      if(out.instance_id) localStorage.setItem('reihub_instance', out.instance_id);\n      localStorage.setItem('reihub_live','1');\n      setLiveChip(); closeModal(); toast('Live Data activated ✓');\n      syncLive();\n    } else {\n      msg.style.color='var(--red)';\n      msg.textContent = out.error || 'That key isn’t valid or its device limit is reached.';\n      btn.disabled=false; btn.textContent='Activate';\n    }\n  }catch(e){\n    msg.style.color='var(--red)';\n    msg.textContent='Couldn’t reach the Live Data service. Check your connection and try again.';\n    btn.disabled=false; btn.textContent='Activate';\n  }\n}\nfunction deactivateLicense(){\n  const s=liveState();\n  fetch(`${WORKER_BASE}/?action=deactivate&key=${encodeURIComponent(s.key)}&instance=${encodeURIComponent(s.instance)}`).catch(()=>{});\n  localStorage.removeItem('reihub_live'); localStorage.removeItem('reihub_instance');\n  setLiveChip(); closeModal(); toast('Live Data turned off');\n}\n\nasync function syncLive(){\n  const s=liveState();\n  if(!s.active || !navigator.onLine) return;\n  try{\n    const r = await fetch(`${WORKER_BASE}/?feed=rate&key=${encodeURIComponent(s.key)}&instance=${encodeURIComponent(s.instance)}`);\n    if(r.status===401){ localStorage.removeItem('reihub_live'); setLiveChip(); toast('Live Data inactive — check your subscription'); return; }\n    if(r.ok){ const j=await r.json(); if(j.data&&j.data.rate){ DB.settings.rate=j.data.rate; save(); renderSnapshot(); if(typeof runAnalyzer==='function') runAnalyzer(); } }\n  }catch(e){ /* stay on cached data */ }\n}\n\n/* metric glossary — detailed explanations surfaced by the ⓘ button on each analyzer tile */\nconst METRIC_DOCS = {\n  'CAP RATE': \"Capitalization rate = annual Net Operating Income ÷ purchase price. It's the property's unleveraged yield — what it earns before any financing. Higher is better: 5–7% is typical, 8%+ is strong. Because it ignores your loan, it's the cleanest way to compare two properties head-to-head.\",\n  'CASH-ON-CASH': \"Cash-on-cash return = annual pre-tax cash flow ÷ the actual cash you put in (down payment + rehab + ~3% closing). Unlike cap rate, it accounts for your mortgage and leverage, so it reflects the return on YOUR dollars. 8%+ is a solid leveraged rental.\",\n  'CASHFLOW/MO': \"Monthly cash flow = effective rent − operating expenses (taxes, insurance, vacancy, maintenance, management) − mortgage principal &amp; interest. This is the cash that actually lands in your pocket each month after every bill is paid. Staying positive is the floor; you want a comfortable buffer for repairs and surprises.\",\n  'NOI/YR': \"Net Operating Income (annual) = rental income minus all operating expenses, but BEFORE the mortgage payment. It's the property's core earning power and the numerator behind the cap rate. Financing choices don't change it — only rent and operating costs do.\",\n  '1% RULE': \"A fast screen: monthly rent ÷ purchase price. At or above 1.0%, rent usually covers costs with room to spare; below it, cash flow gets tight. It's a rule of thumb for quickly filtering listings — not a replacement for full underwriting.\",\n  'EQUITY CAPTURE': \"The instant equity you create = (After-Repair Value − all-in cost) ÷ ARV. It's the cushion between what you're into the deal for and what it's worth once renovated. More capture means more margin of safety if the market dips or the rehab runs over.\",\n  '70% MAO': \"Maximum Allowable Offer under the 70% rule = ARV × 0.70 − rehab. It's the most an investor should pay to leave room for profit, holding costs, and risk. If your purchase price sits above this number, the deal is thin — negotiate down toward it.\",\n  'MONTHLY P&I': \"Monthly principal &amp; interest on the mortgage, based on the loan amount (price × (1 − down %)), your rate, and a 30-year term. Property taxes and insurance are tracked separately under operating expenses, not here.\",\n  'FLIP PROFIT': \"Projected take-home on a flip = ARV − selling costs (~7% for agent + closing) − all-in cost (price + rehab) − about 6 months of holding costs (mortgage + half-year taxes/insurance). This is your estimated gain before income tax.\",\n  'CASH-ON-CASH ROI': \"For a flip: profit ÷ cash invested (down + rehab + closing + holding). It expresses the flip's gain as a return on the money you actually have at risk, so you can weigh it against other uses of that capital. 20%+ is healthy for the time and effort.\",\n  'PROFIT MARGIN': \"Flip profit as a percentage of ARV. It shows how much cushion the deal has against cost overruns and price drops. Experienced flippers generally want 10%+ of ARV; below ~8% leaves dangerously little room for surprises.\",\n  'ALL-IN COST': \"Your total basis in the property = purchase price + rehab budget. It excludes financing and selling costs and is the figure compared against ARV to judge equity capture and the 70% rule.\",\n  'SELLING COSTS': \"Estimated cost to sell after a flip — about 7% of ARV — covering the listing agent commission, title and closing fees, and transfer costs. These come straight off the top of your sale price.\",\n  'HOLDING (6 MO)': \"Estimated carrying cost while you renovate and sell: roughly 6 months of mortgage payments plus half a year of taxes and insurance. The longer a flip drags on, the more this quietly eats into your profit.\",\n  'CASH LEFT IN': \"For BRRRR: the cash still tied up after you refinance = total invested − cash returned by the new loan. The whole point of BRRRR is to drive this toward $0 so you can recycle your capital into the next deal.\",\n  'CAPITAL RECOVERED': \"The share of your invested cash you pull back out through the cash-out refinance. 100% means you recovered every dollar (an effectively 'infinite' return on a free-and-clear position); the more you recover, the faster you can scale.\",\n  'POST-REFI CF/MO': \"Monthly cash flow AFTER the cash-out refinance, using the larger refinanced loan payment (75% of ARV). Pulling cash out raises your mortgage, so this is usually lower than the pre-refi cash flow — confirm it stays comfortably positive before refinancing.\",\n  'REFI LOAN (75%)': \"The new loan assumed at refinance — 75% of After-Repair Value, a common cash-out ceiling for investment properties. The gap between this and your original acquisition loan is the cash handed back to you.\",\n  'STABILIZED P&I': \"Monthly principal &amp; interest on the refinanced loan (75% of ARV). This is the payment you carry long-term as a BRRRR rental, replacing the original acquisition loan once the property is stabilized.\",\n  'YIELD ON COST': \"Annual NOI ÷ all-in cost (price + rehab) — not ÷ price. It tells you the true return on every dollar, purchase AND renovation, so an over-budget rehab shows up as a lower yield. Compare it to market cap rates: higher means your value-add actually paid off.\",\n  'RENT UPLIFT/MO': \"The monthly rent increase the renovation creates = after-reno rent − current rent. This is the income side of a value-add play and what justifies spending on the rehab in the first place.\",\n  'RENO RENT ROI': \"Return on the renovation, measured in rent: added annual rent (uplift × 12) ÷ rehab budget. It answers 'for every dollar I put into repairs, how much yearly rent did I buy?' 10%+ signals a strong value-add.\",\n  '12-MO PROFIT': \"Total economic gain in year one of a fix-and-rent hold = 12 months of cash flow + forced equity from the renovation (ARV − all-in) + first-year market appreciation. Note that most of this is equity on paper — realized only when you sell or refinance — while the cash-flow portion is what you actually pocket along the way.\"\n};\nfunction metricInfo(key){ openModal(key, `<div class=\"text-[13px] leading-relaxed text-ink\">${METRIC_DOCS[key]||'No description available.'}<\u002Fdiv>`); }\n\n\nfunction toggleTheme(){\n  const cur=document.documentElement.getAttribute('data-theme');\n  const next= cur==='dark'?'light':'dark';\n  document.documentElement.setAttribute('data-theme',next);\n  DB.settings.theme=next; save();\n  document.getElementById('themeTxt').textContent = next==='dark'?'◑ Light':'◐ Dark';\n  refreshCharts();\n}\n\n\nfunction priceDropAlerts(){\n  return DB.watch.filter(w=>w.list < w.orig).map(w=>({...w, dropPct:(w.orig-w.list)/w.orig}));\n}\nfunction renderSnapshot(){\n  document.getElementById('snRate').textContent = DB.settings.rate+'%';\n  document.getElementById('snWatch').textContent = DB.watch.length;\n  document.getElementById('snLeads').textContent = DB.leads.length;\n  const al=priceDropAlerts().length + DB.watch.filter(w=>w.dom>90).length;\n  document.getElementById('snAlerts').innerHTML = '⚑ '+al+' alerts';\n}\n\n\nfunction renderDash(){\n  const totVal=DB.portfolio.reduce((s,p)=>s+p.value,0);\n  const totEq=DB.portfolio.reduce((s,p)=>s+(p.value-p.loan),0);\n  const totCf=DB.portfolio.reduce((s,p)=>s+propMetrics(p).cf,0);\n  const avgCap=DB.portfolio.reduce((s,p)=>s+propMetrics(p).cap,0)/Math.max(DB.portfolio.length,1);\n  document.getElementById('kpiRow').innerHTML = [\n    kpi('Portfolio value', fmt(totVal), DB.portfolio.length+' doors'),\n    kpi('Total equity', fmt(totEq), pct(totEq/Math.max(totVal,1))+' of value'),\n    kpi('Monthly cashflow', fmt(totCf), fmt(totCf*12)+' / yr'),\n    kpi('Avg cap rate', pct(avgCap), 'across portfolio'),\n  ].join('');\n\n  const drops=priceDropAlerts(); const stale=DB.watch.filter(w=>w.dom>90);\n  let strip='';\n  if(drops.length||stale.length){\n    strip='<div class=\"card p-2.5 flex flex-wrap items-center gap-2\">'+\n      '<span class=\"badge badge-pass alert-blink\">⚑ Live alerts<\u002Fspan>';\n    drops.forEach(w=> strip+=`<span class=\"badge\" style=\"background:var(--soft);color:var(--red)\">▼ ${w.addr} — dropped ${fmt(w.orig-w.list)} (${pct(w.dropPct)})<\u002Fspan>`);\n    stale.forEach(w=> strip+=`<span class=\"badge\" style=\"background:var(--soft);color:var(--inksoft)\">⏳ ${w.addr} — ${w.dom} DOM (negotiate)<\u002Fspan>`);\n    strip+='<\u002Fdiv>';\n  }\n  document.getElementById('alertStrip').innerHTML=strip;\n\n  document.getElementById('watchList').innerHTML = DB.watch.map(w=>{\n    const drop = w.list<w.orig;\n    const sc=worthScore(watchToDeal(w));\n    return `<div class=\"soft rounded-lg p-2.5\">\n      <div class=\"flex justify-between items-start gap-2\">\n        <div>\n          <div class=\"text-[13px] font-semibold text-ink\">${w.addr}<\u002Fdiv>\n          <div class=\"text-[11px] text-inksoft\">${w.city}, ${w.st} · ${w.beds}bd/${w.baths}ba · ${w.sqft.toLocaleString()} sqft<\u002Fdiv>\n        <\u002Fdiv>\n        <span class=\"badge ${sc.cls}\">${sc.score}<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"flex items-center gap-2 mt-1.5 text-[12px]\">\n        <span class=\"font-bold text-ink\">${fmt(w.list)}<\u002Fspan>\n        ${drop?`<span class=\"text-red font-semibold text-[11px]\">▼ ${fmt(w.orig-w.list)}<\u002Fspan>`:`<span class=\"text-inksoft text-[11px]\">— no change<\u002Fspan>`}\n        <span class=\"ml-auto text-[11px] font-semibold ${w.dom>90?'text-red':'text-inksoft'}\">⏱ ${w.dom} DOM<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"flex gap-1.5 mt-2.5\">\n        <button onclick=\"analyzeWatch('${w.id}')\" class=\"pill pill-outline pill-sm flex-1\">Analyze<\u002Fbutton>\n        <button onclick=\"watchToLead('${w.id}')\" class=\"pill pill-green pill-sm flex-1\">→ Lead<\u002Fbutton>\n        <button onclick=\"delWatch('${w.id}')\" class=\"pill pill-ghost pill-sm\">✕<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('') || '<div class=\"text-[12px] text-inksoft p-2\">No tracked listings. Hit \"＋ Track\".<\u002Fdiv>';\n\n  const scored=DB.watch.map(w=>({w, s:worthScore(watchToDeal(w))})).sort((a,b)=>b.s.score-a.s.score);\n  if(scored.length){\n    const {w,s}=scored[0];\n    document.getElementById('topDeal').innerHTML=`\n      <div class=\"serif text-5xl text-center mb-1\" style=\"color:#fff;font-weight:700\">${s.score}<\u002Fdiv>\n      <div class=\"text-center\"><span class=\"badge ${s.cls}\">${s.verdict}<\u002Fspan><\u002Fdiv>\n      <div class=\"text-[14px] font-semibold mt-3\" style=\"color:#fff\">${w.addr}<\u002Fdiv>\n      <div class=\"text-[11px] mb-2\" style=\"color:rgba(255,255,255,0.7)\">${w.city}, ${w.st}<\u002Fdiv>\n      <div class=\"grid grid-cols-2 gap-1.5 text-[11px]\">\n        ${miniDark('Cap', pct(s.cap))}${miniDark('CoC', pct(s.coc))}\n        ${miniDark('Cashflow', fmt(s.cf)+'/mo')}${miniDark('70% MAO', fmt(s.rule70))}\n      <\u002Fdiv>\n      <button onclick=\"analyzeWatch('${w.id}')\" class=\"pill pill-ondark w-full mt-4\">Underwrite this deal →<\u002Fbutton>`;\n  }\n  renderDashChart();\n  drawMarkers('all');\n}\nfunction miniDark(l,v){ return `<div class=\"rounded-lg px-2 py-1.5\" style=\"background:rgba(255,255,255,0.08)\"><div class=\"text-[9px] uppercase tracking-wide\" style=\"color:rgba(255,255,255,0.6)\">${l}<\u002Fdiv><div class=\"font-bold\" style=\"color:#fff\">${v}<\u002Fdiv><\u002Fdiv>`; }\nfunction mini(l,v){ return `<div class=\"soft rounded-lg px-2 py-1.5\"><div class=\"label text-[9px]\">${l}<\u002Fdiv><div class=\"font-bold text-ink\">${v}<\u002Fdiv><\u002Fdiv>`; }\nfunction kpi(l,v,sub){\n  return `<div class=\"card p-4\">\n    <div class=\"label\">${l}<\u002Fdiv>\n    <div class=\"figure text-3xl mt-1.5\">${v}<\u002Fdiv>\n    <div class=\"text-[11px] text-inksoft mt-1\">${sub}<\u002Fdiv>\n  <\u002Fdiv>`;\n}\n\nfunction watchToDeal(w){\n  return { price:w.list, arv:w.arv, rehab:w.rehab, rent:w.rent, rentAfter:w.rent, taxes:w.taxes, ins:w.taxes*0.35,\n    downPct:0.25, rate:DB.settings.rate, dom:w.dom, dropPct:(w.orig-w.list)/w.orig,\n    mgmt:0.08, maint:0.05, vac:0.05, appreciation:DB.settings.appreciation };\n}\n\n/* charts */\nlet dashChart, equityChart, cfChart, marketChart;\nfunction chartColors(){\n  const cs=getComputedStyle(document.documentElement);\n  const g=v=>cs.getPropertyValue(v).trim();\n  return { accent:g('--accent'), gold:g('--gold'), house:g('--house'), uplift:g('--uplift'),\n    sbgreen:g('--sbgreen'), ink:g('--ink'), grid:g('--chartgrid'), red:g('--red'), card:g('--card') };\n}\nfunction baseOpts(){\n  const c=chartColors();\n  return { responsive:true, maintainAspectRatio:true,\n    plugins:{ legend:{ labels:{ color:c.ink, font:{family:'Inter',weight:'600',size:10} } } },\n    scales:{ x:{ ticks:{color:c.ink,font:{family:'Inter',size:10}}, grid:{color:c.grid} },\n             y:{ ticks:{color:c.ink,font:{family:'Inter',size:10}}, grid:{color:c.grid} } } };\n}\nfunction renderDashChart(){\n  const c=chartColors();\n  const months=['JUL','AUG','SEP','OCT','NOV','DEC','JAN','FEB','MAR','APR','MAY','JUN'];\n  const base=DB.portfolio.reduce((s,p)=>s+propMetrics(p).cf,0);\n  const data=months.map((m,i)=> Math.round(base*(0.82+i*0.018)+ (i%3===0?120:0)));\n  if(dashChart) dashChart.destroy();\n  dashChart=new Chart(document.getElementById('dashCashChart'),{\n    type:'bar', data:{labels:months, datasets:[{label:'Net cashflow', data, backgroundColor:c.accent, borderRadius:4}]},\n    options:baseOpts()\n  });\n}\nfunction refreshCharts(){\n  if(document.getElementById('tab-dashboard').classList.contains('active')) renderDashChart();\n  if(document.getElementById('tab-portfolio').classList.contains('active')) renderPortfolioCharts();\n  if(document.getElementById('tab-market').classList.contains('active')) renderMarket();\n}\n\n\nlet map, markerLayer, boundaryLayer;\nfunction initMap(){\n  map=L.map('map',{scrollWheelZoom:false}).setView([34,-92],4);\n  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19, attribution:'© OpenStreetMap'}).addTo(map);\n  markerLayer=L.layerGroup().addTo(map);\n  boundaryLayer=L.layerGroup().addTo(map);\n  mapInited=true;\n}\nfunction drawMarkers(mode){\n  if(!mapInited) return;\n  markerLayer.clearLayers(); boundaryLayer.clearLayers();\n  const pts=[];\n  const add=(item,kind)=>{\n    const color = kind==='own'?'#00754A':'#cba258';\n    const m=L.circleMarker([item.lat,item.lng],{radius:9,color:'#ffffff',weight:2,fillColor:color,fillOpacity:.95});\n    const taxAssess = kind==='own'? item.value*0.85 : item.list*0.82;\n    const taxRate = ({OH:1.55,FL:0.91,TX:1.81,AZ:0.62}[item.st]||1.1);\n    const annualTax = kind==='own'? item.taxes : (item.taxes||taxAssess*taxRate/100);\n    m.bindPopup(`<b>${item.addr}<\u002Fb><br>${item.city||''} ${item.st}<br>\n      <b>${kind==='own'?'Est. Value':'List'}:<\u002Fb> ${fmt(kind==='own'?item.value:item.list)}<br>\n      <b>Parcel APN:<\u002Fb> ${apn(item)}<br>\n      <b>Assessed:<\u002Fb> ${fmt(taxAssess)}<br>\n      <b>Tax rate:<\u002Fb> ${taxRate}% → ${fmt(annualTax)}/yr`);\n    m.on('click',()=>{ document.getElementById('parcelInfo').innerHTML=\n      `<b>${item.addr}<\u002Fb> · APN ${apn(item)} · Zoning R-1 · Assessed ${fmt(taxAssess)} · Eff. tax ${taxRate}% · Land/Improv 30/70`; });\n    const d=0.004;\n    L.polygon([[item.lat+d,item.lng-d],[item.lat+d,item.lng+d],[item.lat-d,item.lng+d],[item.lat-d,item.lng-d]],\n      {color:color,weight:1.5,fillOpacity:.07,dashArray:'4 3'}).addTo(boundaryLayer);\n    m.addTo(markerLayer); pts.push([item.lat,item.lng]);\n  };\n  if(mode!=='watch') DB.portfolio.forEach(p=>add(p,'own'));\n  if(mode!=='own') DB.watch.forEach(w=>add(w,'watch'));\n  if(pts.length) map.fitBounds(pts, {padding:[40,40], maxZoom:6});\n}\nfunction apn(it){ return (it.st+'-'+Math.abs(Math.round(it.lat*97))+'-'+Math.abs(Math.round(it.lng*53))).toUpperCase(); }\nfunction mapLayer(mode, btn){ document.querySelectorAll('#tab-dashboard .seg').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); drawMarkers(mode); }\n\n\nfunction openAddWatch(){\n  openModal('Track new listing', `\n    ${fld('Address','wAddr','text','123 Main St')}\n    <div class=\"grid grid-cols-2 gap-2\">${fld('City','wCity','text','City')}${fld('State','wSt','text','OH')}<\u002Fdiv>\n    <div class=\"grid grid-cols-2 gap-2\">${fld('List Price','wList','number','189000')}${fld('Original Price','wOrig','number','215000')}<\u002Fdiv>\n    <div class=\"grid grid-cols-3 gap-2\">${fld('Rent/mo','wRent','number','1850')}${fld('Beds','wBeds','number','3')}${fld('Baths','wBaths','number','2')}<\u002Fdiv>\n    <div class=\"grid grid-cols-3 gap-2\">${fld('SqFt','wSqft','number','1480')}${fld('Taxes/yr','wTax','number','3100')}${fld('DOM','wDom','number','30')}<\u002Fdiv>\n    <div class=\"grid grid-cols-2 gap-2\">${fld('ARV','wArv','number','265000')}${fld('Rehab Est.','wRehab','number','42000')}<\u002Fdiv>\n    <div class=\"grid grid-cols-2 gap-2\">${fld('Lat','wLat','number','39.96')}${fld('Lng','wLng','number','-82.99')}<\u002Fdiv>\n    <button onclick=\"addWatch()\" class=\"pill pill-green w-full mt-4\">＋ Start tracking<\u002Fbutton>`);\n}\nfunction v(id){ return document.getElementById(id).value; }\nfunction nv(id){ return parseFloat(document.getElementById(id).value)||0; }\nfunction fld(label,id,type,ph){ return `<label class=\"block mb-2\"><span class=\"label block mb-1\">${label}<\u002Fspan><input id=\"${id}\" type=\"${type}\" placeholder=\"${ph||''}\" class=\"w-full px-3 py-2 text-[13px]\"><\u002Flabel>`; }\nfunction addWatch(){\n  const orig=nv('wOrig')||nv('wList');\n  DB.watch.push({id:'w'+Date.now(), addr:v('wAddr')||'New Listing', city:v('wCity'), st:(v('wSt')||'').toUpperCase(),\n    lat:nv('wLat')||39.96, lng:nv('wLng')||-82.99, list:nv('wList'), orig, rent:nv('wRent'), dom:nv('wDom'),\n    beds:nv('wBeds'), baths:nv('wBaths'), sqft:nv('wSqft'), taxes:nv('wTax'), arv:nv('wArv'), rehab:nv('wRehab'), drops:[]});\n  save(); closeModal(); renderSnapshot(); renderDash(); toast('Now tracking listing.');\n}\nfunction delWatch(id){ DB.watch=DB.watch.filter(w=>w.id!==id); save(); renderSnapshot(); renderDash(); }\nfunction watchToLead(id){ const w=DB.watch.find(x=>x.id===id); DB.leads.push({id:'l'+Date.now(), addr:w.addr, city:w.city+', '+w.st, stage:0, owner:'—', phone:'—', src:'Watchlist', offer:0, notes:'Imported from DOM tracker.'}); save(); renderSnapshot(); toast('Added to pipeline as new lead.'); }\nfunction analyzeWatch(id){ const w=DB.watch.find(x=>x.id===id); go('analyzer'); fillAnalyzer(watchToDeal(w), w.addr); }\n\n\nconst AN_FIELDS=[\n  ['price','PURCHASE PRICE',189000],['arv','ARV (AFTER REPAIR)',265000],\n  ['rehab','REHAB BUDGET',42000],['rent','RENT NOW / MO',1850],\n  ['rentAfter','RENT AFTER RENO',2150],['taxes','ANNUAL TAXES',3100],['ins','ANNUAL INSURANCE',1100],\n];\nconst ECON_FIELDS=[\n  ['downPct','DOWN PAYMENT %',25],['rate','MORTGAGE RATE %',6.85],\n  ['dom','DAYS ON MARKET',62],['dropPct','PRICE DROP %',12],\n  ['appreciation','MKT APPRECIATION %',4.2],['vacExp','VAC+MAINT+MGMT %',18],\n];\nlet anLabel='Untitled Deal';\nlet anStrategy='rental';\nfunction setStrategy(s){\n  anStrategy=s;\n  document.querySelectorAll('#stratToggle button').forEach(b=>{\n    b.className='pill flex-1 '+(b.dataset.s===s?'pill-green':'pill-outline');\n  });\n  runAnalyzer();\n}\nfunction buildAnalyzer(){\n  document.getElementById('anInputs').innerHTML=AN_FIELDS.map(([k,l,d])=>\n    `<label class=\"block\"><span class=\"label block mb-1 text-[9px]\">${l}<\u002Fspan><input id=\"an_${k}\" type=\"number\" value=\"${d}\" oninput=\"runAnalyzer()\" class=\"w-full px-2.5 py-2 text-[12px]\"><\u002Flabel>`).join('');\n  document.getElementById('anEcon').innerHTML=ECON_FIELDS.map(([k,l,d])=>\n    `<label class=\"block\"><span class=\"label block mb-1 text-[9px]\">${l}<\u002Fspan><input id=\"an_${k}\" type=\"number\" value=\"${d}\" oninput=\"runAnalyzer()\" class=\"w-full px-2.5 py-2 text-[12px]\"><\u002Flabel>`).join('');\n  document.getElementById('formulaDoc').innerHTML=`\n    The <b>Worth-Buying Score (0–100)<\u002Fb> re-weights its signals to the <b>strategy<\u002Fb> you pick — the same deal scores differently as a rental, a flip, or a BRRRR.\n    <div class=\"mt-2\"><b>Buy &amp; Hold<\u002Fb> — rewards income: Cap Rate (20%), Cash-on-Cash (20%), Cashflow (16%), 1% Rule (14%), Equity (10%), plus market/leverage signals. Uses <b>rent after reno<\u002Fb> for all income math.<\u002Fdiv>\n    <div class=\"mt-1\"><b>Fix &amp; Rent<\u002Fb> — value-add hold (renovate, then keep as a rental, no refi): Yield-on-Cost (18%), Equity Capture (18%), Cash-on-Cash (16%), Cashflow (16%), and Reno Rent ROI — added annual rent per rehab dollar (12%).<\u002Fdiv>\n    <div class=\"mt-1\"><b>Fix &amp; Flip<\u002Fb> — rewards the spread: Cash-on-Cash ROI (30%), Profit Margin vs ARV (22%), 70%-rule headroom (18%), Equity (12%), plus liquidity. Profit = ARV − 7% selling − all-in − 6mo holding.<\u002Fdiv>\n    <div class=\"mt-1\"><b>BRRRR<\u002Fb> — rewards capital recycled: % cash pulled out on a 75%-ARV refi (26%), post-refi cashflow (20%), Cap Rate (16%), Equity (14%), plus 70%-rule and market.<\u002Fdiv>\n    <div class=\"mt-2\">All strategies surface the <b>70% Rule MAO<\u002Fb> = ARV × 0.70 − rehab.\n    Bands: <b>≥75 Strong Buy · 60–74 Buy · 45–59 Negotiate · &lt;45 Pass.<\u002Fb><\u002Fdiv>`;\n  runAnalyzer();\n}\nfunction readDeal(){\n  return { price:nv('an_price'), arv:nv('an_arv'), rehab:nv('an_rehab'), rent:nv('an_rent'),\n    rentAfter:nv('an_rentAfter'), taxes:nv('an_taxes'), ins:nv('an_ins'), downPct:nv('an_downPct')/100, rate:nv('an_rate'),\n    dom:nv('an_dom'), dropPct:nv('an_dropPct')/100, appreciation:nv('an_appreciation'), strategy:anStrategy,\n    mgmt:nv('an_vacExp')/100*0.44, maint:nv('an_vacExp')/100*0.28, vac:nv('an_vacExp')/100*0.28 };\n}\nfunction runAnalyzer(){\n  const d=readDeal(); const s=worthScore(d);\n  document.getElementById('scoreBig').textContent=s.score;\n  const vb=document.getElementById('scoreVerdict'); vb.textContent=s.verdict; vb.className='badge '+s.cls;\n  document.getElementById('scoreBar').style.width=s.score+'%';\n  const noteByStrat = {\n    rental: s.score>=60\n      ? `✓ Cashflows at <b>${fmt(s.cf)}/mo<\u002Fb> on after-reno rent. 70% MAO is <b>${fmt(s.rule70)}<\u002Fb>.`\n      : `△ Thin rental returns. Target offer ≤ <b>${fmt(s.rule70)}<\u002Fb> or raise the after-reno rent.`,\n    flip: s.score>=60\n      ? `✓ Projected flip profit <b>${fmt(s.flipProfit)}<\u002Fb> at <b>${pct(s.flipROI)}<\u002Fb> cash ROI (after 7% selling + 6mo holding). MAO <b>${fmt(s.rule70)}<\u002Fb>.`\n      : `△ Margin too thin: <b>${fmt(s.flipProfit)}<\u002Fb> profit. Buy at ≤ <b>${fmt(s.rule70)}<\u002Fb> (70% MAO) to clear it.`,\n    brrrr: s.score>=60\n      ? `✓ Pulls out <b>${pct(s.recoveredPct)}<\u002Fb> of capital on refi — only <b>${fmt(s.cashLeftIn)}<\u002Fb> left in, cashflowing <b>${fmt(s.brrrrCf)}/mo<\u002Fb> after.`\n      : `△ Leaves <b>${fmt(s.cashLeftIn)}<\u002Fb> trapped after refi. Lower the basis or lift ARV to recycle more capital.`,\n    fixrent: s.score>=60\n      ? `✓ Renovate to <b>${fmt(s.rentEff)}/mo<\u002Fb> (+${fmt(s.rentUplift)}/mo), a <b>${pct(s.renoROI)}<\u002Fb> return on rehab. Holds at <b>${pct(s.yoc)}<\u002Fb> yield-on-cost, <b>${fmt(s.cf)}/mo<\u002Fb> cashflow.`\n      : `△ Reno barely pencils: rehab returns only <b>${pct(s.renoROI)}<\u002Fb> in added rent (<b>${fmt(s.rentUplift)}/mo<\u002Fb>). Trim the budget or push the after-reno rent.`\n  };\n  document.getElementById('scoreNote').innerHTML = noteByStrat[s.strat];\n  const metricsByStrat = {\n    rental: [\n      ['CAP RATE', pct(s.cap)],['CASH-ON-CASH', pct(s.coc)],\n      ['CASHFLOW/MO', fmt(s.cf)],['NOI/YR', fmt(s.noi)],\n      ['1% RULE', pct(s.onePct)+(s.onePct>=0.01?' ✓':' ✗')],['EQUITY CAPTURE', pct(s.equityCap)],\n      ['70% MAO', fmt(s.rule70)],['MONTHLY P&I', fmt(s.pi)],\n    ],\n    flip: [\n      ['FLIP PROFIT', fmt(s.flipProfit)],['CASH-ON-CASH ROI', pct(s.flipROI)],\n      ['PROFIT MARGIN', pct(s.flipMargin)],['ALL-IN COST', fmt(s.allIn)],\n      ['SELLING COSTS', fmt(s.sellCost)],['HOLDING (6 MO)', fmt(s.holding)],\n      ['70% MAO', fmt(s.rule70)],['EQUITY CAPTURE', pct(s.equityCap)],\n    ],\n    brrrr: [\n      ['CASH LEFT IN', fmt(s.cashLeftIn)],['CAPITAL RECOVERED', pct(s.recoveredPct)],\n      ['POST-REFI CF/MO', fmt(s.brrrrCf)],['REFI LOAN (75%)', fmt(s.refiLoan)],\n      ['CAP RATE', pct(s.cap)],['EQUITY CAPTURE', pct(s.equityCap)],\n      ['70% MAO', fmt(s.rule70)],['STABILIZED P&I', fmt(s.refiPI)],\n    ],\n    fixrent: [\n      ['CASHFLOW/MO', fmt(s.cf)],['CASH-ON-CASH', pct(s.coc)],\n      ['YIELD ON COST', pct(s.yoc)],['EQUITY CAPTURE', pct(s.equityCap)],\n      ['RENT UPLIFT/MO', fmt(s.rentUplift)],['RENO RENT ROI', pct(s.renoROI)],\n      ['CAP RATE', pct(s.cap)],['70% MAO', fmt(s.rule70)],\n      ['12-MO PROFIT', fmt(s.profit12)],\n    ]\n  };\n  const metrics = metricsByStrat[s.strat];\n  document.getElementById('anMetrics').innerHTML=metrics.map(([l,vv])=>{\n    const span = l==='12-MO PROFIT' ? ' col-span-2' : '';\n    return `<div class=\"soft rounded-lg px-3 py-2${span}\"><div class=\"label text-[9px]\">${l}<\u002Fdiv>`\n      + `<div class=\"font-bold text-ink text-[15px]\">${vv}<\u002Fdiv>`\n      + `<button class=\"metric-info\" data-k=\"${l}\" onclick=\"metricInfo(this.dataset.k)\"><span class=\"ic\">i<\u002Fspan> What this is<\u002Fbutton><\u002Fdiv>`;\n  }).join('');\n}\nfunction fillAnalyzer(d, label){\n  anLabel=label||'Untitled';\n  const set=(k,val)=>{ const el=document.getElementById('an_'+k); if(el) el.value=val; };\n  set('price',d.price); set('arv',d.arv); set('rehab',d.rehab); set('rent',d.rent); set('rentAfter',d.rentAfter||d.rent);\n  set('taxes',d.taxes); set('ins',Math.round(d.ins)); set('downPct',Math.round(d.downPct*100));\n  set('rate',d.rate); set('dom',d.dom); set('dropPct',Math.round(d.dropPct*100));\n  set('appreciation',d.appreciation); set('vacExp',Math.round((d.mgmt+d.maint+d.vac)*100));\n  runAnalyzer();\n}\nfunction loadSampleDeal(){ fillAnalyzer(watchToDeal(DB.watch[0]), DB.watch[0].addr); toast('Loaded sample deal: '+DB.watch[0].addr); }\nfunction saveDealToPipeline(){ const d=readDeal(); DB.leads.push({id:'l'+Date.now(), addr:anLabel||'Analyzed Deal', city:'—', stage:1, owner:'—', phone:'—', src:'Analyzer', offer:Math.round(worthScore(d).rule70), notes:'Score '+worthScore(d).score+'. MAO offer prepped.'}); save(); renderSnapshot(); toast('Deal pushed to pipeline with MAO offer.'); }\n\n\nfunction renderPortfolio(){\n  const t=document.getElementById('portTable');\n  let head='<thead><tr>'+['PROPERTY','VALUE','LOAN','EQUITY','RENT','CASHFLOW','CAP','CoC',''].map(h=>`<th class=\"text-left px-2 py-2\">${h}<\u002Fth>`).join('')+'<\u002Ftr><\u002Fthead>';\n  let rows=DB.portfolio.map(p=>{ const m=propMetrics(p);\n    return `<tr>\n      <td class=\"px-2 py-2\"><div class=\"text-[12px] font-semibold text-ink\">${p.addr}<\u002Fdiv><div class=\"text-[10px] text-inksoft\">${p.city}, ${p.st}<\u002Fdiv><\u002Ftd>\n      <td class=\"px-2 py-2 text-ink\">${fmt(p.value)}<\u002Ftd>\n      <td class=\"px-2 py-2 text-inksoft\">${fmt(p.loan)}<\u002Ftd>\n      <td class=\"px-2 py-2 font-bold text-sbgreen\">${fmt(m.equity)}<\u002Ftd>\n      <td class=\"px-2 py-2 text-ink\">${fmt(p.rent)}<\u002Ftd>\n      <td class=\"px-2 py-2 font-bold\" style=\"color:${m.cf>=0?'var(--accent)':'var(--red)'}\">${fmt(m.cf)}<\u002Ftd>\n      <td class=\"px-2 py-2 text-ink\">${pct(m.cap)}<\u002Ftd>\n      <td class=\"px-2 py-2 text-ink\">${pct(m.coc)}<\u002Ftd>\n      <td class=\"px-2 py-2 text-right whitespace-nowrap\"><button onclick=\"propDetail('${p.id}')\" class=\"pill pill-outline pill-sm\">⚙<\u002Fbutton> <button onclick=\"delProp('${p.id}')\" class=\"pill pill-ghost pill-sm\">✕<\u002Fbutton><\u002Ftd>\n    <\u002Ftr>`; }).join('');\n  const tv=DB.portfolio.reduce((s,p)=>s+p.value,0), tl=DB.portfolio.reduce((s,p)=>s+p.loan,0);\n  const tcf=DB.portfolio.reduce((s,p)=>s+propMetrics(p).cf,0);\n  rows+=`<tr style=\"background:var(--soft)\"><td class=\"px-2 py-2 label\">Total<\u002Ftd><td class=\"px-2 py-2 font-bold text-ink\">${fmt(tv)}<\u002Ftd><td class=\"px-2 py-2 text-inksoft\">${fmt(tl)}<\u002Ftd><td class=\"px-2 py-2 font-bold text-sbgreen\">${fmt(tv-tl)}<\u002Ftd><td><\u002Ftd><td class=\"px-2 py-2 font-bold text-accent\">${fmt(tcf)}<\u002Ftd><td colspan=\"3\"><\u002Ftd><\u002Ftr>`;\n  t.innerHTML=head+'<tbody>'+rows+'<\u002Ftbody>';\n\n  const avgCoc=DB.portfolio.reduce((s,p)=>s+propMetrics(p).coc,0)/Math.max(DB.portfolio.length,1);\n  document.getElementById('portKpis').innerHTML=[\n    kpi('Net worth (equity)', fmt(tv-tl),'in real estate'),\n    kpi('Annual cashflow', fmt(tcf*12), fmt(tcf)+'/mo'),\n    kpi('Avg cash-on-cash', pct(avgCoc),'return'),\n    kpi('Leverage (LTV)', pct(tl/Math.max(tv,1)),'portfolio-wide'),\n  ].join('');\n\n  let totBudget=0, totSpent=0;\n  DB.reno.forEach(r=>{ const cost=r.costs.reduce((s,c)=>s+c.qty*c.unit,0); const spent=cost*(r.tasks.filter(t=>t.done).length/Math.max(r.tasks.length,1)); totBudget+=cost; totSpent+=spent; });\n  const rb=document.getElementById('rehabBudget');\n  rb.innerHTML=`\n    <div class=\"text-center mb-3\"><div class=\"label\">Total rehab budget<\u002Fdiv><div class=\"figure text-3xl mt-1\">${fmt(totBudget)}<\u002Fdiv><\u002Fdiv>\n    ${DB.reno.map(r=>{ const cost=r.costs.reduce((s,c)=>s+c.qty*c.unit,0); const prog=r.tasks.filter(t=>t.done).length/Math.max(r.tasks.length,1); const spent=cost*prog;\n      return `<div class=\"soft rounded-lg p-2.5 mb-2\">\n        <div class=\"flex justify-between text-[12px]\"><span class=\"font-semibold text-ink\">${r.name}<\u002Fspan><span class=\"text-inksoft\">${Math.round(prog*100)}%<\u002Fspan><\u002Fdiv>\n        <div class=\"text-[11px] text-inksoft\">${fmt(spent)} spent / ${fmt(cost)} budget<\u002Fdiv>\n        <div class=\"rounded-full h-2 mt-1.5 overflow-hidden\" style=\"background:var(--hairline)\"><div class=\"h-full\" style=\"width:${Math.min(prog*100,100)}%;background:${spent>cost?'var(--red)':'var(--accent)'}\"><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>`; }).join('')}\n    <div class=\"text-[11px] text-center text-inksoft mt-2\">Deployed: <b class=\"text-ink\">${fmt(totSpent)}<\u002Fb> · Remaining: <b class=\"text-ink\">${fmt(totBudget-totSpent)}<\u002Fb><\u002Fdiv>`;\n\n  renderPortfolioCharts();\n}\nfunction renderPortfolioCharts(){\n  const c=chartColors();\n  const labels=DB.portfolio.map(p=>p.addr.split(' ').slice(0,2).join(' '));\n  if(equityChart) equityChart.destroy();\n  equityChart=new Chart(document.getElementById('equityChart'),{ type:'doughnut',\n    data:{labels, datasets:[{data:DB.portfolio.map(p=>p.value-p.loan), backgroundColor:[c.accent,c.gold,c.uplift,c.sbgreen,'#8a9a5b'], borderColor:c.card, borderWidth:2}]},\n    options:{responsive:true, plugins:{legend:{position:'bottom', labels:{color:c.ink,font:{family:'Inter',weight:'600',size:9}}}}} });\n  if(cfChart) cfChart.destroy();\n  cfChart=new Chart(document.getElementById('cfChart'),{ type:'bar',\n    data:{labels, datasets:[{label:'Cashflow/mo', data:DB.portfolio.map(p=>Math.round(propMetrics(p).cf)), backgroundColor:DB.portfolio.map(p=>propMetrics(p).cf>=0?c.accent:c.red), borderRadius:4}]},\n    options:baseOpts() });\n}\nfunction openAddProp(){\n  openModal('Add owned property', `\n    ${fld('Address','pAddr','text','410 Oak Park Dr')}\n    <div class=\"grid grid-cols-2 gap-2\">${fld('City','pCity','text','City')}${fld('State','pSt','text','OH')}<\u002Fdiv>\n    <div class=\"grid grid-cols-2 gap-2\">${fld('Est. Value','pVal','number','228000')}${fld('Loan Balance','pLoan','number','142000')}<\u002Fdiv>\n    <div class=\"grid grid-cols-2 gap-2\">${fld('Cost Basis','pBasis','number','171000')}${fld('Rate %','pRate','number','5.9')}<\u002Fdiv>\n    <div class=\"grid grid-cols-3 gap-2\">${fld('Rent/mo','pRent','number','1975')}${fld('Taxes/yr','pTax','number','3200')}${fld('Ins/yr','pIns','number','1100')}<\u002Fdiv>\n    <button onclick=\"addProp()\" class=\"pill pill-green w-full mt-4\">＋ Add property<\u002Fbutton>`);\n}\nfunction addProp(){\n  DB.portfolio.push({id:'p'+Date.now(), addr:v('pAddr')||'New Property', city:v('pCity'), st:(v('pSt')||'').toUpperCase(),\n    lat:39.9+Math.random()*0.2, lng:-83+Math.random()*0.2, value:nv('pVal'), loan:nv('pLoan'), basis:nv('pBasis'),\n    rent:nv('pRent'), taxes:nv('pTax'), ins:nv('pIns'), mgmt:0.08, maint:0.05, vac:0.05, rate:nv('pRate'), beds:3, baths:2});\n  save(); closeModal(); renderPortfolio(); toast('Property added to portfolio.');\n}\nfunction delProp(id){ DB.portfolio=DB.portfolio.filter(p=>p.id!==id); save(); renderPortfolio(); }\nfunction propDetail(id){\n  const p=DB.portfolio.find(x=>x.id===id); const m=propMetrics(p);\n  openModal('Cashflow / ROI — '+p.addr, `\n    <div class=\"grid grid-cols-2 gap-2 text-[12px] mb-3\">\n      ${detRow('Gross Rent', fmt(p.rent)+'/mo')}\n      ${detRow('Vacancy/Maint/Mgmt', '−'+fmt(p.rent*(p.mgmt+p.maint+p.vac))+'/mo')}\n      ${detRow('Taxes + Insurance', '−'+fmt((p.taxes+p.ins)/12)+'/mo')}\n      ${detRow('Mortgage P&I', '−'+fmt(m.pi)+'/mo')}\n      ${detRow('Net cashflow', fmt(m.cf)+'/mo', true)}\n      ${detRow('Annual Cashflow', fmt(m.cf*12))}\n      ${detRow('Cap Rate', pct(m.cap))}\n      ${detRow('Cash-on-Cash', pct(m.coc))}\n      ${detRow('Equity', fmt(m.equity))}\n      ${detRow('Total ROI (CF+amort+apprec)', pct(m.coc+0.04+DB.settings.appreciation/100))}\n    <\u002Fdiv>\n    <div class=\"label mb-1.5\">Adjust<\u002Fdiv>\n    <div class=\"grid grid-cols-2 gap-2\">\n      <label class=\"label\" style=\"text-transform:none\">Rent/mo<input id=\"ed_rent\" type=\"number\" value=\"${p.rent}\" class=\"w-full px-3 py-2 text-[12px] mt-1\"><\u002Flabel>\n      <label class=\"label\" style=\"text-transform:none\">Value<input id=\"ed_val\" type=\"number\" value=\"${p.value}\" class=\"w-full px-3 py-2 text-[12px] mt-1\"><\u002Flabel>\n    <\u002Fdiv>\n    <button onclick=\"saveProp('${id}')\" class=\"pill pill-green w-full mt-4\">Save changes<\u002Fbutton>`);\n}\nfunction detRow(l,v,big){ return `<div class=\"soft rounded-lg px-3 py-2 ${big?'col-span-2':''}\"><span class=\"label\">${l}<\u002Fspan><div class=\"${big?'figure text-2xl':'font-bold text-ink'} mt-0.5\">${v}<\u002Fdiv><\u002Fdiv>`; }\nfunction saveProp(id){ const p=DB.portfolio.find(x=>x.id===id); p.rent=nv('ed_rent'); p.value=nv('ed_val'); save(); closeModal(); renderPortfolio(); toast('Updated.'); }\n\n\nconst STAGES=['LEAD','CONTACTED','OFFER MADE','UNDER CONTRACT','CLOSED'];\nfunction renderPipeline(){\n  const k=document.getElementById('kanban');\n  k.innerHTML=STAGES.map((st,i)=>{\n    const items=DB.leads.filter(l=>l.stage===i);\n    return `<div class=\"soft rounded-xl p-2 min-h-[120px]\">\n      <div class=\"label flex justify-between mb-2\"><span>${st}<\u002Fspan><span class=\"badge\" style=\"background:var(--greenlight);color:var(--sbgreen);padding:0 8px\">${items.length}<\u002Fspan><\u002Fdiv>\n      ${items.map(l=>leadCard(l)).join('') || '<div class=\"text-[10px] text-inksoft opacity-60 italic\">empty<\u002Fdiv>'}\n    <\u002Fdiv>`;\n  }).join('');\n  const fl=document.getElementById('fsboList');\n  fl.innerHTML=DB.fsbo.map((f,i)=>`<label class=\"flex items-center gap-2.5 text-[12px] py-1 cursor-pointer\">\n    <input type=\"checkbox\" ${f.d?'checked':''} onchange=\"toggleFsbo(${i})\" style=\"width:16px;height:16px;accent-color:var(--accent)\">\n    <span class=\"${f.d?'line-through text-inksoft':'text-ink'}\">${f.t}<\u002Fspan><\u002Flabel>`).join('');\n  const done=DB.fsbo.filter(f=>f.d).length;\n  document.getElementById('fsboBar').style.width=(done/DB.fsbo.length*100)+'%';\n}\nfunction leadCard(l){\n  return `<div class=\"card p-2.5 mb-2\">\n    <div class=\"text-[12px] font-semibold text-ink\">${l.addr}<\u002Fdiv>\n    <div class=\"text-[10px] text-inksoft\">${l.city} · ${l.owner}<\u002Fdiv>\n    <div class=\"text-[10px] text-inksoft mt-0.5\">${l.phone} · <span class=\"badge\" style=\"background:var(--greenlight);color:var(--sbgreen);padding:1px 7px\">${l.src}<\u002Fspan><\u002Fdiv>\n    ${l.offer?`<div class=\"text-[11px] font-bold text-sbgreen mt-1.5\">Offer: ${fmt(l.offer)}<\u002Fdiv>`:''}\n    ${l.notes?`<div class=\"text-[10px] text-inksoft mt-1 italic\">${l.notes}<\u002Fdiv>`:''}\n    <div class=\"flex gap-1 mt-2.5\">\n      ${l.stage>0?`<button onclick=\"moveLead('${l.id}',-1)\" class=\"pill pill-ghost pill-sm\">◀<\u002Fbutton>`:''}\n      ${l.stage<4?`<button onclick=\"moveLead('${l.id}',1)\" class=\"pill pill-green pill-sm flex-1\">Advance ▶<\u002Fbutton>`:'<span class=\"badge badge-strong flex-1 justify-center\">✓ Closed<\u002Fspan>'}\n      <button onclick=\"editLead('${l.id}')\" class=\"pill pill-outline pill-sm\">✎<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>`;\n}\nfunction moveLead(id,d){ const l=DB.leads.find(x=>x.id===id); l.stage=clamp(l.stage+d,0,4); save(); renderPipeline(); }\nfunction toggleFsbo(i){ DB.fsbo[i].d=!DB.fsbo[i].d; save(); renderPipeline(); }\nfunction openAddLead(){\n  openModal('New lead', `\n    ${fld('Property Address','lAddr','text','123 Main St')}\n    ${fld('City / State','lCity','text','Columbus, OH')}\n    <div class=\"grid grid-cols-2 gap-2\">${fld('Owner','lOwner','text','Name')}${fld('Phone','lPhone','text','555-0100')}<\u002Fdiv>\n    <div class=\"grid grid-cols-2 gap-2\">\n      <label class=\"block mb-2\"><span class=\"label block mb-1\">Source<\u002Fspan><select id=\"lSrc\" class=\"w-full px-3 py-2 text-[13px]\"><option>FSBO<\u002Foption><option>Driving for $<\u002Foption><option>Wholesaler<\u002Foption><option>MLS<\u002Foption><option>Referral<\u002Foption><\u002Fselect><\u002Flabel>\n      ${fld('Offer (opt)','lOffer','number','0')}\n    <\u002Fdiv>\n    <label class=\"block mb-2\"><span class=\"label block mb-1\">Notes<\u002Fspan><textarea id=\"lNotes\" rows=\"2\" class=\"w-full px-3 py-2 text-[13px]\"><\u002Ftextarea><\u002Flabel>\n    <button onclick=\"addLead()\" class=\"pill pill-green w-full mt-2\">＋ Add lead<\u002Fbutton>`);\n}\nfunction addLead(){\n  DB.leads.push({id:'l'+Date.now(), addr:v('lAddr')||'New Lead', city:v('lCity'), stage:0, owner:v('lOwner')||'—', phone:v('lPhone')||'—', src:v('lSrc'), offer:nv('lOffer'), notes:v('lNotes')});\n  save(); closeModal(); renderSnapshot(); renderPipeline(); toast('Lead added.');\n}\nfunction editLead(id){\n  const l=DB.leads.find(x=>x.id===id);\n  openModal('Edit lead', `\n    ${fld('Address','eAddr','text','')}\n    <div class=\"grid grid-cols-2 gap-2\">${fld('Owner','eOwner','text','')}${fld('Phone','ePhone','text','')}<\u002Fdiv>\n    ${fld('Offer','eOffer','number','0')}\n    <label class=\"block mb-2\"><span class=\"label block mb-1\">Notes<\u002Fspan><textarea id=\"eNotes\" rows=\"2\" class=\"w-full px-3 py-2 text-[13px]\">${l.notes}<\u002Ftextarea><\u002Flabel>\n    <div class=\"flex gap-2\"><button onclick=\"saveLead('${id}')\" class=\"pill pill-green flex-1\">Save<\u002Fbutton>\n    <button onclick=\"delLead('${id}')\" class=\"pill pill-red\">Delete<\u002Fbutton><\u002Fdiv>`);\n  document.getElementById('eAddr').value=l.addr; document.getElementById('eOwner').value=l.owner;\n  document.getElementById('ePhone').value=l.phone; document.getElementById('eOffer').value=l.offer;\n}\nfunction saveLead(id){ const l=DB.leads.find(x=>x.id===id); l.addr=v('eAddr'); l.owner=v('eOwner'); l.phone=v('ePhone'); l.offer=nv('eOffer'); l.notes=v('eNotes'); save(); closeModal(); renderPipeline(); toast('Lead saved.'); }\nfunction delLead(id){ DB.leads=DB.leads.filter(x=>x.id!==id); save(); closeModal(); renderSnapshot(); renderPipeline(); }\n\n\nfunction renderReno(){\n  const sel=document.getElementById('renoSel');\n  if(sel.options.length!==DB.reno.length){ sel.innerHTML=DB.reno.map(r=>`<option value=\"${r.id}\">${r.name}<\u002Foption>`).join(''); }\n  const r=DB.reno.find(x=>x.id===sel.value)||DB.reno[0]; if(!r) return; sel.value=r.id;\n\n  const maxDay=Math.max(...r.tasks.map(t=>t.s+t.len), 1);\n  const g=document.getElementById('gantt');\n  const startDate=new Date(r.start);\n  g.innerHTML=`<div class=\"label mb-3\">Start ${r.start} · ${maxDay}-day timeline · ${r.tasks.filter(t=>t.done).length}/${r.tasks.length} tasks done<\u002Fdiv>\n    <div class=\"space-y-1.5\">${r.tasks.map((t,i)=>{\n      const left=(t.s/maxDay*100), w=(t.len/maxDay*100);\n      const ed=new Date(startDate.getTime()+(t.s+t.len)*86400000).toISOString().slice(5,10);\n      return `<div class=\"flex items-center gap-2\">\n        <div class=\"w-40 shrink-0 text-[11px] ${t.done?'text-inksoft line-through':'text-ink'} flex items-center gap-1.5\">\n          <input type=\"checkbox\" ${t.done?'checked':''} onchange=\"toggleTask('${r.id}',${i})\" style=\"width:14px;height:14px;accent-color:var(--accent)\">${t.t}<\u002Fdiv>\n        <div class=\"flex-1 soft rounded-full h-5 relative\" style=\"min-width:160px\">\n          <div class=\"gantt-bar absolute h-5 flex items-center justify-end pr-2\" style=\"left:${left}%;width:${Math.max(w,5)}%;${t.done?'background:var(--sbgreen)':''}\">\n            <span class=\"text-[8px] font-bold text-white\">${t.len}d<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"w-12 shrink-0 text-[9px] text-inksoft text-right\">${ed}<\u002Fdiv>\n      <\u002Fdiv>`; }).join('')}<\u002Fdiv>`;\n\n  const ct=document.getElementById('costTable');\n  let total=0;\n  let head='<thead><tr>'+['ITEM','CAT','QTY','UNIT','TOTAL',''].map(h=>`<th class=\"text-left px-2 py-2\">${h}<\u002Fth>`).join('')+'<\u002Ftr><\u002Fthead>';\n  let rows=r.costs.map((c,i)=>{ const tot=c.qty*c.unit; total+=tot;\n    const catStyle = c.cat==='Labor'?'background:var(--gold);color:#3a2c0c':c.cat==='Soft'?'background:var(--house);color:#fff':'background:var(--greenlight);color:var(--sbgreen)';\n    return `<tr><td class=\"px-2 py-2 text-[12px] text-ink\">${c.item}<div class=\"text-[9px] text-inksoft\">${c.vendor}<\u002Fdiv><\u002Ftd>\n      <td class=\"px-2 py-2\"><span class=\"badge\" style=\"${catStyle};padding:1px 8px\">${c.cat}<\u002Fspan><\u002Ftd>\n      <td class=\"px-2 py-2 text-ink\">${c.qty}<\u002Ftd><td class=\"px-2 py-2 text-ink\">${fmt1(c.unit)}<\u002Ftd><t '+m.median)}\n    <label class=\"block mb-2\"><span class=\"label block mb-1\">Effective rate %<\u002Fspan><input id=\"txRate\" type=\"number\" step=\"0.01\" value=\"${m.tax}\" oninput=\"calcTax()\" class=\"w-full px-3 py-2 text-[13px]\"><\u002Flabel><\u002Fdiv>\n    <button onclick=\"calcTax()\" class=\"pill pill-outline w-full\">Calculate<\u002Fbutton>\n    <div id=\"txOut\" class=\"mt-3\"><\u002Fdiv>`;\n  document.getElementById('txVal').addEventListener('input',calcTax);\n  document.getElementById('transferTool').innerHTML=`\n    <div class=\"grid grid-cols-2 gap-2\">${fld('Sale Price','trPrice','number',''+m.median)}\n    <label class=\"block mb-2\"><span class=\"label block mb-1\">Transfer %<\u002Fspan><input id=\"trRate\" type=\"number\" step=\"0.01\" value=\"${m.transfer}\" oninput=\"calcTransfer()\" class=\"w-full px-3 py-2 text-[13px]\"><\u002Flabel><\u002Fdiv>\n    <div class=\"grid grid-cols-2 gap-2\"><label class=\"block mb-2\"><span class=\"label block mb-1\">Sales tax % (materials)<\u002Fspan><input id=\"trSales\" type=\"number\" step=\"0.01\" value=\"${m.sales}\" oninput=\"calcTransfer()\" class=\"w-full px-3 py-2 text-[13px]\"><\u002Flabel>\n    ${fld('Material Spend','trMat','number','40000')}<\u002Fdiv>\n    <button onclick=\"calcTransfer()\" class=\"pill pill-outline w-full\">Calculate<\u002Fbutton>\n    <div id=\"trOut\" class=\"mt-3\"><\u002Fdiv>`;\n  document.getElementById('trMat').addEventListener('input',calcTransfer);\n  calcTax(); calcTransfer();\n}\nfunction calcTax(){\n  const val=nv('txVal'), rate=nv('txRate');\n  const annual=val*rate/100;\n  document.getElementById('txOut').innerHTML=`\n    <div class=\"soft rounded-xl p-4 text-center\"><div class=\"label\">Annual property tax<\u002Fdiv>\n    <div class=\"figure text-3xl mt-1\">${fmt(annual)}<\u002Fdiv>\n    <div class=\"text-[11px] text-inksoft mt-1\">${fmt(annual/12)}/mo · ${fmt(annual/365)}/day escrow<\u002Fdiv><\u002Fdiv>`;\n}\nfunction calcTransfer(){\n  const price=nv('trPrice'), rate=nv('trRate'), sales=nv('trSales'), mat=nv('trMat');\n  const transfer=price*rate/100, salesTax=mat*sales/100;\n  document.getElementById('trOut').innerHTML=`\n    <div class=\"grid grid-cols-2 gap-2\">\n      <div class=\"soft rounded-xl p-3 text-center\"><div class=\"label text-[9px]\">Transfer tax<\u002Fdiv><div class=\"figure text-2xl mt-0.5\">${fmt(transfer)}<\u002Fdiv><\u002Fdiv>\n      <div class=\"soft rounded-xl p-3 text-center\"><div class=\"label text-[9px]\">Sales tax on materials<\u002Fdiv><div class=\"figure text-2xl mt-0.5\">${fmt(salesTax)}<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"text-[11px] text-center text-inksoft mt-2\">Total transaction taxes: <b class=\"text-ink\">${fmt(transfer+salesTax)}<\u002Fb><\u002Fdiv>`;\n}\n\n\nfunction renderListings(){\n  const L=DB.listing;\n  document.getElementById('listingForm').innerHTML=`\n    ${lf('Address','addr','text')}\n    <div class=\"grid grid-cols-2 gap-2\">${lf('Price','price','number')}${lf('Year Built','year','number')}<\u002Fdiv>\n    <div class=\"grid grid-cols-3 gap-2\">${lf('Beds','beds','number')}${lf('Baths','baths','number')}${lf('SqFt','sqft','number')}<\u002Fdiv>\n    <label class=\"block\"><span class=\"label block mb-1\">Description<\u002Fspan><textarea id=\"li_desc\" rows=\"4\" oninput=\"syncListing()\" class=\"w-full px-3 py-2 text-[13px]\">${L.desc}<\u002Ftextarea><\u002Flabel>\n    <label class=\"block\"><span class=\"label block mb-1\">Features (pipe | separated)<\u002Fspan><input id=\"li_features\" oninput=\"syncListing()\" value=\"${L.features}\" class=\"w-full px-3 py-2 text-[13px]\"><\u002Flabel>`;\n  ['addr','price','year','beds','baths','sqft'].forEach(k=>{ document.getElementById('li_'+k).value=L[k]; });\n  drawListing();\n}\nfunction lf(label,k,type){ return `<label class=\"block\"><span class=\"label block mb-1\">${label}<\u002Fspan><input id=\"li_${k}\" type=\"${type}\" oninput=\"syncListing()\" class=\"w-full px-3 py-2 text-[13px]\"><\u002Flabel>`; }\nfunction syncListing(){\n  const L=DB.listing;\n  L.addr=v('li_addr'); L.price=nv('li_price'); L.year=nv('li_year'); L.beds=nv('li_beds'); L.baths=nv('li_baths'); L.sqft=nv('li_sqft'); L.desc=v('li_desc'); L.features=v('li_features');\n  save(); drawListing();\n}\nfunction drawListing(){\n  const L=DB.listing;\n  document.getElementById('listingPreview').innerHTML=`\n    <div class=\"card overflow-hidden\" style=\"border:1px solid var(--hairline)\">\n      <div style=\"height:170px;background:repeating-linear-gradient(45deg,var(--ceramic),var(--ceramic) 12px,var(--greenlight) 12px,var(--greenlight) 24px)\" class=\"grid place-items-center\">\n        <span class=\"label text-inksoft\">[ Drop property photo here ]<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"p-4\">\n        <div class=\"figure text-3xl\">${fmt(L.price)}<\u002Fdiv>\n        <div class=\"text-[13px] font-semibold text-ink mt-0.5\">${L.addr}<\u002Fdiv>\n        <div class=\"flex flex-wrap gap-1.5 my-2.5\">\n          <span class=\"soft rounded-full px-2.5 py-1 text-[11px] font-semibold text-ink\">${L.beds} bd<\u002Fspan>\n          <span class=\"soft rounded-full px-2.5 py-1 text-[11px] font-semibold text-ink\">${L.baths} ba<\u002Fspan>\n          <span class=\"soft rounded-full px-2.5 py-1 text-[11px] font-semibold text-ink\">${(L.sqft||0).toLocaleString()} sqft<\u002Fspan>\n          <span class=\"soft rounded-full px-2.5 py-1 text-[11px] font-semibold text-ink\">Built ${L.year}<\u002Fspan>\n        <\u002Fdiv>\n        <p class=\"text-[12px] text-ink leading-relaxed\">${L.desc}<\u002Fp>\n        <div class=\"flex flex-wrap gap-1.5 mt-2.5\">${(L.features||'').split('|').filter(Boolean).map(f=>`<span class=\"badge\" style=\"background:var(--greenlight);color:var(--sbgreen)\">✓ ${f.trim()}<\u002Fspan>`).join('')}<\u002Fdiv>\n        <div class=\"band rounded-lg px-3 py-2.5 mt-3 text-center text-[11px] font-semibold\" style=\"color:#fff\">${(L.price/Math.max(L.sqft,1)).toFixed(0)} $/sqft · FSBO · call to schedule<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n}\n\n\nfunction exportReport(){\n  const { jsPDF }=window.jspdf; const doc=new jsPDF({unit:'pt',format:'letter'}); const W=612;\n  let y=54;\n  doc.setFillColor(30,57,50); doc.rect(0,0,W,46,'F');\n  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(16);\n  doc.text('REI EXECUTION SYSTEM — INVESTOR REPORT',28,30);\n  doc.setTextColor(33,33,33); doc.setFontSize(9); doc.text('Generated '+new Date().toLocaleString(),28,62); y=84;\n\n  const tv=DB.portfolio.reduce((s,p)=>s+p.value,0), tl=DB.portfolio.reduce((s,p)=>s+p.loan,0);\n  const tcf=DB.portfolio.reduce((s,p)=>s+propMetrics(p).cf,0);\n  const section=(t)=>{ doc.setFillColor(0,98,65); doc.rect(28,y,W-56,18,'F'); doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.text(t,34,y+13); y+=28; doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(33,33,33); };\n  const line=(l,v)=>{ doc.text(l,34,y); doc.text(String(v),W-34,y,{align:'right'}); y+=15; };\n\n  section('PORTFOLIO SUMMARY');\n  line('Total value', fmt(tv)); line('Total debt', fmt(tl)); line('Total equity', fmt(tv-tl));\n  line('Monthly cashflow', fmt(tcf)); line('Annual cashflow', fmt(tcf*12)); line('Doors', DB.portfolio.length);\n  y+=6; section('OWNED PROPERTIES');\n  DB.portfolio.forEach(p=>{ const m=propMetrics(p); line(p.addr+' ('+p.st+')', fmt(m.equity)+' eq · '+fmt(m.cf)+'/mo · '+pct(m.cap)); });\n  y+=6; section('WATCHLIST — TOP SIGNALS');\n  DB.watch.map(w=>({w,s:worthScore(watchToDeal(w))})).sort((a,b)=>b.s.score-a.s.score).forEach(({w,s})=>{ line(w.addr+' ('+w.st+')', 'Score '+s.score+' · '+s.verdict+' · MAO '+fmt(s.rule70)); });\n  y+=6; section('PIPELINE');\n  STAGES.forEach((st,i)=>{ const n=DB.leads.filter(l=>l.stage===i).length; line(st, n+' lead(s)'); });\n\n  doc.setFillColor(30,57,50); doc.rect(0,766,W,26,'F'); doc.setTextColor(255,255,255); doc.setFontSize(8);\n  doc.text('© 2026 REI EXECUTION SYSTEM · Confidential investor report · Data stored on-device',28,782);\n  doc.save('REI-Investor-Report.pdf'); toast('Report exported to PDF.');\n}\nfunction exportListing(){\n  const { jsPDF }=window.jspdf; const doc=new jsPDF({unit:'pt',format:'letter'}); const L=DB.listing; const W=612;\n  doc.setFillColor(30,57,50); doc.rect(0,0,W,46,'F'); doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(15);\n  doc.text('FOR SALE BY OWNER',28,30);\n  doc.setFillColor(212,233,226); doc.rect(28,70,W-56,120,'F'); doc.setTextColor(0,98,65); doc.setFontSize(11); doc.text('[ PROPERTY PHOTO ]',W/2,135,{align:'center'});\n  doc.setTextColor(0,98,65); doc.setFont('helvetica','bold'); doc.setFontSize(26); doc.text(fmt(L.price),28,225);\n  doc.setTextColor(33,33,33); doc.setFontSize(12); doc.setFont('helvetica','normal'); doc.text(L.addr,28,245);\n  doc.text(`${L.beds} Beds  ·  ${L.baths} Baths  ·  ${(L.sqft||0).toLocaleString()} SqFt  ·  Built ${L.year}`,28,265);\n  doc.setFontSize(11); const lines=doc.splitTextToSize(L.desc,W-56); doc.text(lines,28,295);\n  let y=295+lines.length*14+10; doc.setFont('helvetica','bold'); doc.text('FEATURES',28,y); y+=16; doc.setFont('helvetica','normal');\n  (L.features||'').split('|').filter(Boolean).forEach(f=>{ doc.text('•  '+f.trim(),34,y); y+=15; });\n  doc.setFillColor(0,117,74); doc.rect(28,y+10,W-56,30,'F'); doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(12);\n  doc.text(`${(L.price/Math.max(L.sqft,1)).toFixed(0)} $/SqFt   ·   FSBO   ·   CALL TO SCHEDULE A SHOWING`,W/2,y+30,{align:'center'});\n  doc.save('FSBO-Listing.pdf'); toast('Listing flyer exported.');\n}\n\n\nfunction tick(){ const d=new Date(); document.getElementById('clock').textContent=d.toLocaleString('en',{weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }\nfunction updateNet(){ const on=navigator.onLine; document.getElementById('netTxt').textContent=on?'Saved local':'Offline mode'; document.getElementById('netDot').style.background=on?'var(--accent)':'var(--yellow)'; }\nwindow.addEventListener('online',updateNet); window.addEventListener('offline',updateNet);\n\n\nfunction renderAll(){ renderSnapshot(); buildAnalyzer(); renderPortfolio(); renderPipeline(); renderListings(); renderDash(); }\nfunction init(){\n  load();\n  document.documentElement.setAttribute('data-theme', DB.settings.theme||'light');\n  document.getElementById('themeTxt').textContent = (DB.settings.theme==='dark')?'◑ Light':'◐ Dark';\n  initMap();\n  renderAll();\n  tick(); setInterval(tick,30000); updateNet();\n  if(!LIVE_LOCKED){ setLiveChip(); syncLive(); setInterval(syncLive, 15*60*1000); }\n  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });\n}\nwindow.addEventListener('DOMContentLoaded', init);\nif(document.readyState!=='loading'){ init(); }\n<\u002Fscript>\n\n\n<script>\ndocument.addEventListener('contextmenu', e => e.preventDefault());\ndocument.addEventListener('keydown', e => {\n  const k = e.key.toLowerCase();\n  if (e.key === 'F12' ||\n      (e.ctrlKey && e.shiftKey && ['i','j','c'].includes(k)) ||\n      (e.ctrlKey && k === 'u')) {\n    e.preventDefault();\n  }\n});\n<\u002Fscript>\n<\u002Fbody><\u002Fhtml>"
  </script>
